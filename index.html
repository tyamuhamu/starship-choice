<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>STARSHIP🚀好き顔9選</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>STARSHIP🚀好き顔9選</h1>
        <p id="roundText">第1ラウンド</p>
    </header>

    <main>

        <!-- 説明 -->
        <section class="instruction">
            <p id="instructionText">
                残したいアイドルを選んでください
            </p>
        </section>


        <!-- アイドルカードを表示する場所 -->
        <section
            id="cardContainer"
            class="card-container">
        </section>


        <!-- 選択確定ボタン -->
        <button
            id="confirmButton"
            class="confirm-button">
            このメンバーで決定
        </button>


        <!-- 最終結果 -->
        <section
            id="resultSection"
            class="result-section hidden">

            <h2>最終選抜メンバー</h2>


            <!-- 最終9人を表示 -->
            <div
                id="finalContainer"
                class="card-container">
            </div>


            <!-- 共有 -->
            <div class="share-buttons">

                <button
                    id="shareXButton"
                    class="share-button x-button">
                    共有
                </button>

            </div>


            <!-- 最初からやり直す -->
            <button
                id="restartButton"
                class="restart-button">
                もう一度やる
            </button>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
